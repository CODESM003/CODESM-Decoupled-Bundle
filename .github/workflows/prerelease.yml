name: Prerelease Version Bump & Release

on:
  push:
    branches:
      - prerelease

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: bump')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump prerelease version
        id: version
        run: |
          # Read current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Check if version already has -prerelease-rc
          if [[ $CURRENT_VERSION == *"-prerelease-rc"* ]]; then
            # Extract base version and rc number
            BASE_VERSION=$(echo $CURRENT_VERSION | sed 's/-prerelease-rc.*//')
            RC_NUMBER=$(echo $CURRENT_VERSION | sed 's/.*-prerelease-rc//')
            # Increment rc number
            NEW_RC=$((RC_NUMBER + 1))
            NEW_VERSION="${BASE_VERSION}-prerelease-rc${NEW_RC}"
          else
            # Append -prerelease-rc1 to current version
            NEW_VERSION="${CURRENT_VERSION}-prerelease-rc1"
          fi

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update package.json
          node -e "const pkg = require('./package.json'); pkg.version = '$NEW_VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 4) + '\n');"
          npm install --package-lock-only

      - name: Update PHP plugin file version header
        run: |
          sed -i "s/^ *\* Version:.*/\ * Version:     ${{ steps.version.outputs.version }}/" codesm-decoupled-bundle.php

      - name: Update PHP plugin file version constant
        run: |
          sed -i "s/define('CODESM_DECOUPLED_BUNDLE_VERSION',        '.*/define('CODESM_DECOUPLED_BUNDLE_VERSION',        '${{ steps.version.outputs.version }}');/" codesm-decoupled-bundle.php

      - name: Commit version bump
        run: |
          git add package.json package-lock.json codesm-decoupled-bundle.php
          git commit -m "chore: bump prerelease version to ${{ steps.version.outputs.version }}"

      - name: Create git tag
        run: git tag "v${{ steps.version.outputs.version }}"

      - name: Push changes and tag
        run: |
          git push origin prerelease
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create clean ZIP archive
        run: |
          mkdir -p build/codesm-decoupled-bundle
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='.claude' ./ build/codesm-decoupled-bundle/
          cd build
          zip -r codesm-decoupled-bundle.zip codesm-decoupled-bundle/
          mv codesm-decoupled-bundle.zip ..

      - name: Create GitHub Release (Pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          prerelease: true
          generate_release_notes: true
          files: codesm-decoupled-bundle.zip
